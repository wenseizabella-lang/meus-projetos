<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabela revisão</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table>
      <caption>
        tabelas de produtos
      </caption>
      <thead>
        <tr>
          <th>produtos</th>
          <th>preços</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>arroz</td>
          <td>R$29,99</td>
        </tr>
        <tr>
          <td>feijão</td>
          <td>10,99</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>total de produtos</th>
          <td>59,99</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
