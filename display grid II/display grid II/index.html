<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 90%;
            height: 95vh;
            margin: 14px auto;

            display: grid;

            grid-template-columns: 20% 60% 20%;
            grid-template-rows: 80px 50px 1fr 40px;

            grid-template-areas:
                "header header header"
                "nav nav nav"
                "lateral section aside"
                "footer footer footer";
        }

    
        .header {
            grid-area: header;
            background-color: black;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        
        .nav {
            grid-area: nav;
            background-color: #E0FFFF;
            color: #000;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .lateral {
            grid-area: lateral;
            background-color: gray;
            color: white;
            text-align: center;
        }

        
        .section {
            grid-area: section;
            background-color: #f2f2f2;
            color: black;
            text-align: center;
        }

    
        .aside {
            grid-area: aside;
            background-color: pink;
            color: black;
            text-align: center;
        }

        
        .footer {
            grid-area: footer;
            background-color: black;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        
        h1, h2 {
            font-size: 32px;
        }

        /* Ajuste para telas pequenas */
        @media (max-width: 600px) {
            .container {
                width: 95%;
                height: 95vh;

                grid-template-columns: 1fr 2fr;
                grid-template-rows: 70px 45px 1fr 100px 40px;

                grid-template-areas:
                    "header header"
                    "nav nav"
                    "lateral section"
                    "aside aside"
                    "footer footer";
            }

            h1, h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <h2>Header</h2>
        </header>

        <nav class="nav">
            <h2>Nav</h2>
        </nav>

        <div class="lateral">
            <h2>Div-lateral</h2>
        </div>

        <main class="section">
            <h2>Section</h2>
        </main>

        <aside class="aside">
            <h2>Aside</h2>
        </aside>

        <footer class="footer">
            <h2>Footer</h2>
        </footer>

    </div>

</body>
</html>
